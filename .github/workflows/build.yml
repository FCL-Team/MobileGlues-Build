name: Build AAR

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 每周五 UTC 18:00（北京时间周六 02:00）跟随上游 dev 分支构建一次
    - cron: "0 18 * * 5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone MobileGlues dev
        run: |
          git clone --depth 1 --branch dev --recurse-submodules --shallow-submodules \
            https://github.com/MobileGL-Dev/MobileGlues.git MobileGlues/MobileGlues
          MG_SHA=$(git -C MobileGlues/MobileGlues rev-parse HEAD)
          echo "MG_SHA=${MG_SHA::8}" >> "$GITHUB_ENV"
          echo "Building MobileGL-Dev/MobileGlues dev@${MG_SHA::8}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release AAR
        run: ./gradlew :MobileGlues:assembleRelease --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-release-${{ env.MG_SHA }}
          path: MobileGlues/build/outputs/aar/MobileGlues-release.aar
          if-no-files-found: error

      - name: Refresh dev-latest release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          {
            echo "从 [MobileGL-Dev/MobileGlues](https://github.com/MobileGL-Dev/MobileGlues) \`dev@${MG_SHA}\` 构建。"
            echo ""
            echo "AAR 文件名保持 \`MobileGlues-release.aar\`，可直接放入 FCL 的 \`FCL/libs/\`。"
          } > /tmp/notes.md
          gh release create dev-latest --prerelease \
            --title "MobileGlues dev ($MG_SHA)" \
            --notes-file /tmp/notes.md \
            MobileGlues/build/outputs/aar/MobileGlues-release.aar
